name: Update inputs
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Update all tracked flakes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nix shell --inputs-from . nixpkgs#uv nixpkgs#python3 -c uv run --offline --no-python-downloads --script hack/test_update_flakes.py
          nix shell --inputs-from . nixpkgs#uv nixpkgs#python3 -c uv run --offline --no-python-downloads --script hack/update-flakes.py
      - name: Check updated inputs
        run: nix flake check -L
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-inputs
          title: "chore: update flake inputs"
          commit-message: "chore: update flake inputs"
          body: "Updates tracked flake inputs after local checks."
